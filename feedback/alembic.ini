# alembic.ini — Alembic configuration for Feedback Viewer.
# The database URL is set dynamically in migrations/env.py from the
# DB_PATH environment variable, NOT from sqlalchemy.url below.

[alembic]
script_location = migrations

# Logging configuration — mirrors the app's log format.
[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s [%(levelname)-5.5s] %(message)s
datefmt = %H:%M:%S
